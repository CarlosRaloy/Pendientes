  <path d="M520 760 L700 660 L860 700 L1000 680 L1180 700 L1380 680 L1600 740 L1600 800 L520 800 Z" fill="#ecdfe4"/>
  <path d="M700 700 L860 720 L960 760 L760 780 Z" fill="#c8c3e6"/>
