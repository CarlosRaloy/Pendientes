<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7b2f6"/><stop offset=".28" stop-color="#d9c8f0"/><stop offset=".45" stop-color="#f8d6c6"/><stop offset=".6" stop-color="#c9c9f2"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d9bff"/><stop offset="1" stop-color="#1f56e0"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c8dff"/><stop offset=".5" stop-color="#1d4fe0"/><stop offset="1" stop-color="#0b2fb0"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fb2ff"/><stop offset=".4" stop-color="#2463f0"/><stop offset="1" stop-color="#0a2aa8"/>
    </linearGradient>
    <linearGradient id="w4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f86ff"/><stop offset="1" stop-color="#0c33b8"/>
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#e6f2ff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- ola lejana, desenfocada -->
  <path d="M-50 560 C 150 470, 330 500, 520 560 S 820 640, 1000 600 L1000 1050 L-50 1050 Z" fill="url(#w1)" filter="url(#soft)" opacity=".9"/>
  <!-- ola grande de la derecha -->
  <path d="M300 760 C 600 640, 900 330, 1200 250 S 1560 250, 1700 300 L1700 1050 L300 1050 Z" fill="#00103a" opacity=".35" filter="url(#sh)" transform="translate(-10 30)"/>
  <path d="M300 760 C 600 640, 900 330, 1200 250 S 1560 250, 1700 300 L1700 1050 L300 1050 Z" fill="url(#w3)"/>
  <path d="M520 700 C 760 560, 980 330, 1210 262 S 1520 262, 1700 312" fill="none" stroke="url(#crest)" stroke-width="5" filter="url(#soft)" opacity=".9"/>
  <path d="M560 690 C 790 550, 990 335, 1215 268" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
  <!-- pliegue medio -->
  <path d="M600 1050 C 760 820, 1000 560, 1300 470 S 1600 470, 1700 500 L1700 1050 Z" fill="#00103a" opacity=".3" filter="url(#sh)"/>
  <path d="M600 1050 C 760 820, 1000 560, 1300 470 S 1600 470, 1700 500 L1700 1050 Z" fill="url(#w2)"/>
  <path d="M760 860 C 940 650, 1120 520, 1310 482 S 1580 480, 1700 512" fill="none" stroke="#cfe4ff" stroke-opacity=".5" stroke-width="3" filter="url(#soft)"/>
  <!-- ola frontal izquierda -->
  <path d="M-50 860 C 150 760, 420 760, 640 840 S 1000 1000, 1200 1050 L-50 1050 Z" fill="#00103a" opacity=".3" filter="url(#sh)" transform="translate(0 -20)"/>
  <path d="M-50 860 C 150 760, 420 760, 640 840 S 1000 1000, 1200 1050 L-50 1050 Z" fill="url(#w4)"/>
  <path d="M-50 860 C 150 760, 420 760, 640 840" fill="none" stroke="#e3f0ff" stroke-opacity=".6" stroke-width="3" filter="url(#soft)"/>
</svg>
