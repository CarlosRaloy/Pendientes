  <path d="M960 330 L1040 380 L1120 480 L1070 520 L990 420 L940 380 Z" fill="#c9647a" opacity=".85"/>
  <path d="M1150 470 L1210 600 L1140 640 L1070 520 L1120 480 Z" fill="#9a8fc4"/>
